# fly.toml – Fly.io configuration for RaceLens.
#
# 1. Change the app name below to something unique (or let `fly launch` pick one).
# 2. Follow docs/DEPLOY.md, option B:
#      fly launch --no-deploy
#      fly volumes create racelens_data --region syd --size 1
#      fly secrets set RACELENS_PASSWORD=choose-a-password   (required: without it the app will not start)
#      fly deploy
#
# Sydney is deliberate: TAB and Sportsbet only answer Australian IP addresses.

app = "racelens-<yourname>"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  RACELENS_HOST = "0.0.0.0"
  RACELENS_PORT = "4850"
  # Fly owns the hostname (<app>.fly.dev), so any Host header is fine; the password protects the app.
  # '*' also marks the server as hosted: it shows https://<app>.fly.dev (not container addresses) on the
  # Settings phone card, and it refuses to start without RACELENS_PASSWORD.
  RACELENS_ALLOWED_HOSTS = "*"
  # Fly's HTTPS proxy sits in front, so the client address it passes on is trusted (the login lock counts
  # wrong passwords per phone). RaceLens also does this by itself on Fly (FLY_APP_NAME); kept here to be explicit.
  RACELENS_TRUST_PROXY = "1"
  # Custom domain? Set RACELENS_PUBLIC_URL = "https://racing.example.com" so Settings shows that address instead.
  RACELENS_DATA_DIR = "/data"
  RACELENS_QR = "0"
  # RACELENS_PASSWORD is NOT set here – it is a secret:  fly secrets set RACELENS_PASSWORD=...

[http_service]
  internal_port = 4850
  force_https = true
  # The background scheduler (pre-race checks, results polling) must keep running
  # on race day, so the machine is never stopped for being idle. (Older flyctl: false.)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

# Research packs, settings and the login secret live here and survive deploys.
[[mounts]]
  source = "racelens_data"
  destination = "/data"

# 256 MB is enough for normal use. If researching a 10-race meeting feels slow,
# run `fly scale memory 512` (or change memory below and deploy again).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
